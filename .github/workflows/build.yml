name: Build ServerTeleport

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Utworz projekt
        shell: bash
        run: |
          set -e

          mkdir -p src/main/java/pl/reniferek/servertp
          mkdir -p src/main/resources

          cat > pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">

            <modelVersion>4.0.0</modelVersion>

            <groupId>pl.reniferek</groupId>
            <artifactId>ServerTeleport</artifactId>
            <version>1.0.0</version>

            <properties>
              <maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>

            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>

            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>1.21.4-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>

            <build>
              <finalName>ServerTeleport</finalName>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>
                  <configuration>
                    <release>21</release>
                  </configuration>
                </plugin>
              </plugins>
            </build>

          </project>
          EOF

          cat > src/main/resources/plugin.yml <<'EOF'
          name: ServerTeleport
          version: 1.0.0
          main: pl.reniferek.servertp.ServerTeleport
          api-version: '1.21'
          EOF

          cat > src/main/resources/config.yml <<'EOF'
          # Komenda wykonywana przez gracza po wejściu w obszar.
          # NIE wpisuj "/" na początku.
          command: "server LifeStealSMPspawn"

          # Obszar teleportacji
          min-x: -4
          max-x: 4

          min-y: 68
          max-y: 77

          z: 9

          # Czy blok, w którym znajduje się gracz, musi być powietrzem?
          require-air: true

          # Czy komenda ma być wykonywana tylko raz przy wejściu?
          once-per-entry: true
          EOF

          cat > src/main/java/pl/reniferek/servertp/ServerTeleport.java <<'EOF'
          package pl.reniferek.servertp;

          import org.bukkit.Location;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerMoveEvent;
          import org.bukkit.plugin.java.JavaPlugin;

          import java.util.HashSet;
          import java.util.Set;
          import java.util.UUID;

          public final class ServerTeleport extends JavaPlugin implements Listener {

              private final Set<UUID> playersInside = new HashSet<>();

              @Override
              public void onEnable() {

                  saveDefaultConfig();

                  getServer().getPluginManager()
                          .registerEvents(this, this);

                  getLogger().info("================================");
                  getLogger().info("ServerTeleport WLACZONY");
                  getLogger().info("Komenda: " + getConfig().getString("command"));
                  getLogger().info("Obszar: X -4..4");
                  getLogger().info("Obszar: Y 68..77");
                  getLogger().info("Obszar: Z = 9");
                  getLogger().info("================================");
              }

              @Override
              public void onDisable() {
                  playersInside.clear();
              }

              @EventHandler
              public void onPlayerMove(PlayerMoveEvent event) {

                  if (event.getTo() == null) {
                      return;
                  }

                  Player player = event.getPlayer();
                  Location loc = event.getTo();

                  int x = loc.getBlockX();
                  int y = loc.getBlockY();
                  int z = loc.getBlockZ();

                  int minX = getConfig().getInt("min-x");
                  int maxX = getConfig().getInt("max-x");

                  int minY = getConfig().getInt("min-y");
                  int maxY = getConfig().getInt("max-y");

                  int requiredZ = getConfig().getInt("z");

                  boolean inArea =
                          x >= minX &&
                          x <= maxX &&
                          y >= minY &&
                          y <= maxY &&
                          z == requiredZ;

                  boolean requireAir =
                          getConfig().getBoolean("require-air", true);

                  if (requireAir) {
                      inArea = inArea &&
                              loc.getBlock().getType().isAir();
                  }

                  UUID uuid = player.getUniqueId();

                  if (inArea) {

                      boolean alreadyInside =
                              playersInside.contains(uuid);

                      if (!alreadyInside ||
                              !getConfig().getBoolean("once-per-entry", true)) {

                          playersInside.add(uuid);

                          executeCommand(player);
                      }

                  } else {

                      playersInside.remove(uuid);
                  }
              }

              private void executeCommand(Player player) {

                  String command =
                          getConfig().getString("command", "");

                  if (command == null || command.trim().isEmpty()) {

                      getLogger().warning(
                              "Komenda w config.yml jest pusta!"
                      );

                      return;
                  }

                  command = command.trim();

                  if (command.startsWith("/")) {
                      command = command.substring(1);
                  }

                  getLogger().info(
                          "Gracz " +
                          player.getName() +
                          " wszedl w obszar."
                  );

                  getLogger().info(
                          "Wykonuje jako gracz: /" +
                          command
                  );

                  boolean result =
                          player.performCommand(command);

                  if (!result) {

                      getLogger().warning(
                              "Komenda nie zostala wykonana poprawnie: /" +
                              command
                      );
                  }
              }
          }
          EOF

      - name: Zbuduj plugin
        run: mvn -B clean package

      - name: Przeslij JAR
        uses: actions/upload-artifact@v4
        with:
          name: ServerTeleport-JAR
          path: target/ServerTeleport.jar
