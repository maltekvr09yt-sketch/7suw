name: Build LifeStealSMP ServerTeleport

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # PAPER
      # ============================================================

      - name: Create Paper project
        run: |
          mkdir -p paper/src/main/java/pl/reniferek/servertp
          mkdir -p paper/src/main/resources

          cat > paper/pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>pl.reniferek</groupId>
              <artifactId>ServerTeleport-Paper</artifactId>
              <version>1.0.0</version>

              <properties>
                  <maven.compiler.release>21</maven.compiler.release>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.21.4-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>21</release>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF

          cat > paper/src/main/resources/plugin.yml <<'EOF'
          name: ServerTeleport
          version: 1.0.0
          main: pl.reniferek.servertp.ServerTeleport
          api-version: '1.21'
          EOF

          cat > paper/src/main/resources/config.yml <<'EOF'
          server: "LifeStealSMPspawn"

          min-x: -4
          max-x: 4

          min-y: 68
          max-y: 77

          z: 9

          require-air: false
          once-per-entry: true
          EOF

          cat > paper/src/main/java/pl/reniferek/servertp/ServerTeleport.java <<'EOF'
          package pl.reniferek.servertp;

          import org.bukkit.Location;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerMoveEvent;
          import org.bukkit.event.player.PlayerQuitEvent;
          import org.bukkit.plugin.java.JavaPlugin;

          import java.io.ByteArrayOutputStream;
          import java.io.DataOutputStream;
          import java.io.IOException;
          import java.util.HashSet;
          import java.util.Set;
          import java.util.UUID;

          public class ServerTeleport extends JavaPlugin implements Listener {

              private static final String CHANNEL = "serverteleport:main";
              private final Set<UUID> playersInRegion = new HashSet<>();

              @Override
              public void onEnable() {
                  saveDefaultConfig();

                  getServer().getMessenger().registerOutgoingPluginChannel(this, CHANNEL);
                  getServer().getPluginManager().registerEvents(this, this);

                  getLogger().info("ServerTeleport Paper wlaczony.");
              }

              @Override
              public void onDisable() {
                  getServer().getMessenger().unregisterOutgoingPluginChannel(this, CHANNEL);
                  playersInRegion.clear();
              }

              @EventHandler
              public void onMove(PlayerMoveEvent event) {
                  if (event.getTo() == null) {
                      return;
                  }

                  Player player = event.getPlayer();
                  Location location = event.getTo();
                  UUID uuid = player.getUniqueId();

                  boolean inside = isInsideRegion(location);

                  if (inside) {
                      if (getConfig().getBoolean("once-per-entry", true)
                              && playersInRegion.contains(uuid)) {
                          return;
                      }

                      playersInRegion.add(uuid);
                      askVelocityToConnect(player);
                  } else {
                      playersInRegion.remove(uuid);
                  }
              }

              private boolean isInsideRegion(Location location) {
                  int x = location.getBlockX();
                  int y = location.getBlockY();
                  int z = location.getBlockZ();

                  int minX = getConfig().getInt("min-x");
                  int maxX = getConfig().getInt("max-x");
                  int minY = getConfig().getInt("min-y");
                  int maxY = getConfig().getInt("max-y");
                  int requiredZ = getConfig().getInt("z");

                  if (x < minX || x > maxX) {
                      return false;
                  }

                  if (y < minY || y > maxY) {
                      return false;
                  }

                  if (z != requiredZ) {
                      return false;
                  }

                  if (getConfig().getBoolean("require-air", false)
                          && !location.getBlock().isEmpty()) {
                      return false;
                  }

                  return true;
              }

              private void askVelocityToConnect(Player player) {
                  try {
                      ByteArrayOutputStream bytes = new ByteArrayOutputStream();
                      DataOutputStream out = new DataOutputStream(bytes);

                      out.writeUTF("CHECK");
                      out.writeUTF(getConfig().getString(
                              "server",
                              "LifeStealSMPspawn"
                      ));

                      player.sendPluginMessage(
                              this,
                              CHANNEL,
                              bytes.toByteArray()
                      );

                      out.close();
                      bytes.close();
                  } catch (IOException e) {
                      getLogger().severe(
                              "Blad Plugin Messaging: " + e.getMessage()
                      );
                  }
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent event) {
                  playersInRegion.remove(event.getPlayer().getUniqueId());
              }
          }
          EOF

      # ============================================================
      # VELOCITY
      # ============================================================

      - name: Create Velocity project
        run: |
          mkdir -p velocity/src/main/java/pl/reniferek/servertp

          cat > velocity/pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>pl.reniferek</groupId>
              <artifactId>ServerTeleport-Velocity</artifactId>
              <version>1.2.0</version>

              <properties>
                  <maven.compiler.release>21</maven.compiler.release>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>com.velocitypowered</groupId>
                      <artifactId>velocity-api</artifactId>
                      <version>3.4.0-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>21</release>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF

          cat > velocity/src/main/java/pl/reniferek/servertp/ServerTeleportVelocity.java <<'EOF'
          package pl.reniferek.servertp;

          import com.google.inject.Inject;
          import com.velocitypowered.api.command.SimpleCommand;
          import com.velocitypowered.api.event.Subscribe;
          import com.velocitypowered.api.event.connection.PluginMessageEvent;
          import com.velocitypowered.api.event.proxy.ProxyInitializeEvent;
          import com.velocitypowered.api.plugin.Plugin;
          import com.velocitypowered.api.plugin.annotation.DataDirectory;
          import com.velocitypowered.api.proxy.Player;
          import com.velocitypowered.api.proxy.ProxyServer;
          import com.velocitypowered.api.proxy.ServerConnection;
          import com.velocitypowered.api.proxy.messages.MinecraftChannelIdentifier;
          import com.velocitypowered.api.proxy.server.RegisteredServer;

          import net.kyori.adventure.key.Key;
          import net.kyori.adventure.sound.Sound;
          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.NamedTextColor;

          import org.slf4j.Logger;

          import java.io.ByteArrayInputStream;
          import java.io.DataInputStream;
          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.Optional;
          import java.util.Properties;
          import java.util.concurrent.TimeUnit;

          @Plugin(
                  id = "serverteleport",
                  name = "ServerTeleport",
                  version = "1.3.0",
                  authors = {"Reniferek"}
          )
          public class ServerTeleportVelocity {

              private static final String CHANNEL = "serverteleport:main";
              private static final String TARGET_SERVER = "LifeStealSMPspawn";

              private final ProxyServer proxy;
              private final Logger logger;
              private final Path dataDirectory;

              private Path configFile;
              private boolean blockade = true;

              /*
               * Status jest ustalany automatycznie:
               * AKTYWNY       = ping odpowiada
               * STARTOWANY    = serwer był offline i właśnie wrócił
               * RESTARTOWANY  = serwer był aktywny, zniknął i wrócił
               * STOPUJĄCY     = serwer był aktywny i przestał odpowiadać
               * WYŁĄCZONY     = serwer długo nie odpowiada
               *
               * Velocity nie dostaje od Paper dokładnej informacji "start/stop/restart",
               * więc stany STARTOWANY/RESTARTOWANY/STOPUJĄCY są wykrywane z przejść ping.
               */
              private volatile ServerState serverState = ServerState.WYLACZONY;
              private volatile boolean everActive = false;
              private volatile long lastOfflineAt = 0L;

              private enum ServerState {
                  AKTYWNY,
                  STARTOWANY,
                  RESTARTOWANY,
                  STOPUJACY,
                  WYLACZONY
              }

              @Inject
              public ServerTeleportVelocity(
                      ProxyServer proxy,
                      Logger logger,
                      @DataDirectory Path dataDirectory
              ) {
                  this.proxy = proxy;
                  this.logger = logger;
                  this.dataDirectory = dataDirectory;
              }

              @Subscribe
              public void onProxyInitialization(ProxyInitializeEvent event) {
                  try {
                      Files.createDirectories(dataDirectory);
                      configFile = dataDirectory.resolve("config.properties");
                      loadConfig();
                  } catch (IOException e) {
                      logger.error("Nie mozna utworzyc konfiguracji.", e);
                  }

                  proxy.getChannelRegistrar().register(
                          MinecraftChannelIdentifier.from(CHANNEL)
                  );

                  proxy.getCommandManager().register(
                          proxy.getCommandManager()
                                  .metaBuilder("blokadaLifeStealSMP")
                                  .plugin(this)
                                  .build(),
                          new BlockadeCommand()
                  );

                  proxy.getCommandManager().register(
                          proxy.getCommandManager()
                                  .metaBuilder("statusLifeStealSMP")
                                  .plugin(this)
                                  .build(),
                          new StatusCommand()
                  );

                  logger.info("ServerTeleport Velocity wlaczony.");
                  logger.info("LifeStealSMP blokada: " +
                          (blockade ? "ODBlokowane / OTWARTE" : "ZABLOKOWANE"));

                  proxy.getScheduler()
                          .buildTask(this, this::refreshServerState)
                          .repeat(2, TimeUnit.SECONDS)
                          .schedule();
              }

              private void loadConfig() throws IOException {
                  Properties properties = new Properties();

                  if (!Files.exists(configFile)) {
                      properties.setProperty("blockade", "true");

                      try (var writer = Files.newBufferedWriter(configFile)) {
                          properties.store(writer, "ServerTeleport");
                      }

                      blockade = true;
                      return;
                  }

                  try (var reader = Files.newBufferedReader(configFile)) {
                      properties.load(reader);
                  }

                  blockade = Boolean.parseBoolean(
                          properties.getProperty("blockade", "true")
                  );
              }

              private void saveConfig() {
                  try {
                      Properties properties = new Properties();
                      properties.setProperty(
                              "blockade",
                              Boolean.toString(blockade)
                      );

                      try (var writer = Files.newBufferedWriter(configFile)) {
                          properties.store(writer, "ServerTeleport");
                      }
                  } catch (IOException e) {
                      logger.error("Nie mozna zapisac konfiguracji.", e);
                  }
              }

              private void refreshServerState() {
                  Optional<RegisteredServer> optionalServer =
                          proxy.getServer(TARGET_SERVER);

                  if (optionalServer.isEmpty()) {
                      if (serverState == ServerState.AKTYWNY
                              || serverState == ServerState.STARTOWANY
                              || serverState == ServerState.RESTARTOWANY) {
                          serverState = ServerState.STOPUJACY;
                          lastOfflineAt = System.currentTimeMillis();
                      } else if (serverState == ServerState.STOPUJACY
                              && System.currentTimeMillis() - lastOfflineAt > 10000L) {
                          serverState = ServerState.WYLACZONY;
                      }
                      return;
                  }

                  optionalServer.get().ping().whenComplete((ping, error) -> {
                      if (error == null) {
                          if (serverState == ServerState.WYLACZONY) {
                              if (!everActive) {
                                  serverState = ServerState.STARTOWANY;
                              } else if (lastOfflineAt > 0L
                                      && System.currentTimeMillis() - lastOfflineAt <= 60000L) {
                                  serverState = ServerState.RESTARTOWANY;
                              } else {
                                  serverState = ServerState.STARTOWANY;
                              }
                          } else if (serverState == ServerState.STOPUJACY) {
                              serverState = ServerState.RESTARTOWANY;
                          }

                          everActive = true;

                          proxy.getScheduler()
                                  .buildTask(this, () -> {
                                      if (serverState == ServerState.STARTOWANY
                                              || serverState == ServerState.RESTARTOWANY) {
                                          serverState = ServerState.AKTYWNY;
                                      }
                                  })
                                  .delay(4, TimeUnit.SECONDS)
                                  .schedule();
                      } else {
                          if (serverState == ServerState.AKTYWNY
                                  || serverState == ServerState.STARTOWANY
                                  || serverState == ServerState.RESTARTOWANY) {
                              serverState = ServerState.STOPUJACY;
                              lastOfflineAt = System.currentTimeMillis();
                          } else if (serverState == ServerState.STOPUJACY
                                  && System.currentTimeMillis() - lastOfflineAt > 10000L) {
                              serverState = ServerState.WYLACZONY;
                          }
                      }
                  });
              }

              private String getStateText() {
                  return serverState == ServerState.AKTYWNY ? "URUCHOMIONY" : "WYŁĄCZONY";
              }

              private NamedTextColor getStateColor() {
                  return switch (serverState) {
                      case AKTYWNY -> NamedTextColor.GREEN;
                      case STARTOWANY, RESTARTOWANY -> NamedTextColor.YELLOW;
                      case STOPUJACY, WYLACZONY -> NamedTextColor.RED;
                  };
              }

              @Subscribe
              public void onPluginMessage(PluginMessageEvent event) {
                  if (!event.getIdentifier().getId().equalsIgnoreCase(CHANNEL)) {
                      return;
                  }

                  event.setResult(
                          PluginMessageEvent.ForwardResult.handled()
                  );

                  if (!(event.getSource() instanceof ServerConnection connection)) {
                      return;
                  }

                  Player player = connection.getPlayer();

                  try {
                      DataInputStream in = new DataInputStream(
                              new ByteArrayInputStream(event.getData())
                      );

                      String action = in.readUTF();

                      if (!action.equalsIgnoreCase("CHECK")) {
                          return;
                      }

                      String serverName = in.readUTF();

                      if (!serverName.equalsIgnoreCase(TARGET_SERVER)) {
                          return;
                      }

                      checkServerAndConnect(player);
                  } catch (IOException e) {
                      logger.error("Blad Plugin Messaging.", e);
                  }
              }

              private void checkServerAndConnect(Player player) {
                  if (!blockade) {
                      player.sendMessage(
                              Component.text(
                                      "LifeStealSMP jest aktualnie zablokowany."
                              ).color(NamedTextColor.RED)
                      );
                      playBlockedSound(player);
                      return;
                  }

                  Optional<RegisteredServer> optionalServer =
                          proxy.getServer(TARGET_SERVER);

                  if (optionalServer.isEmpty()) {
                      serverState = ServerState.WYLACZONY;
                      player.sendMessage(
                              Component.text(
                                      "LifeStealSMP jest aktualnie wyłączony."
                              ).color(NamedTextColor.RED)
                      );
                      playBlockedSound(player);
                      return;
                  }

                  RegisteredServer server = optionalServer.get();

                  // Sprawdzamy serwer ponownie w momencie wejścia do portalu.
                  // Jeśli odpowiada, nie piszemy nic — od razu łączymy.
                  server.ping().whenComplete((ping, error) -> {
                      if (error == null) {
                          serverState = ServerState.AKTYWNY;
                          everActive = true;
                          connectToServer(player);
                          return;
                      }

                      if (serverState == ServerState.AKTYWNY
                              || serverState == ServerState.STARTOWANY
                              || serverState == ServerState.RESTARTOWANY) {
                          serverState = ServerState.STOPUJACY;
                          lastOfflineAt = System.currentTimeMillis();
                      }

                      switch (serverState) {
                          case STARTOWANY ->
                                  player.sendMessage(Component.text(
                                          "LifeStealSMP jest aktualnie startowany."
                                  ).color(NamedTextColor.YELLOW));
                          case RESTARTOWANY ->
                                  player.sendMessage(Component.text(
                                          "LifeStealSMP jest aktualnie restartowany."
                                  ).color(NamedTextColor.YELLOW));
                          case STOPUJACY ->
                                  player.sendMessage(Component.text(
                                          "LifeStealSMP jest aktualnie stopowany."
                                  ).color(NamedTextColor.RED));
                          case WYLACZONY ->
                                  player.sendMessage(Component.text(
                                          "LifeStealSMP jest aktualnie wyłączony."
                                  ).color(NamedTextColor.RED));
                          default -> { }
                      }

                      playPortalSound(player);
                  });
              }

              private void connectToServer(Player player) {
                  Optional<RegisteredServer> optionalServer =
                          proxy.getServer(TARGET_SERVER);

                  if (optionalServer.isEmpty()) {
                      serverState = ServerState.WYLACZONY;
                      player.sendMessage(
                              Component.text(
                                      "LifeStealSMP jest aktualnie wyłączony."
                              ).color(NamedTextColor.RED)
                      );
                      playOffSound(player);
                      return;
                  }

                  RegisteredServer server = optionalServer.get();

                  player.createConnectionRequest(server)
                          .connect()
                          .exceptionally(connectionError -> {
                              player.sendMessage(
                                      Component.text(
                                              "Nie udało się połączyć z LifeStealSMPspawn."
                                      ).color(NamedTextColor.RED)
                              );

                              playOffSound(player);

                              logger.error(
                                      "Blad polaczenia " +
                                              player.getUsername(),
                                      connectionError
                              );

                              return null;
                          });
              }

              private void sendStatus(Player player) {
                  String blockadeText = blockade ? "ODBLOKOWANY" : "ZABLOKOWANY";

                  Component header = Component.text(
                          "§8§m----------------------------"
                  );

                  Component line1 = Component.text(
                          "§eLifeStealSMP"
                  );

                  Component line2 = Component.text(
                          "§7Blokada: "
                  ).append(
                          Component.text(
                                  blockadeText,
                                  blockade ? NamedTextColor.GREEN : NamedTextColor.RED
                          )
                  );

                  Component line3 = Component.text(
                          "§7Serwer: "
                  ).append(
                          Component.text(
                                  getStateText(),
                                  getStateColor()
                          )
                  );

                  Component footer = Component.text(
                          "§8§m----------------------------"
                  );

                  player.sendMessage(header);
                  player.sendMessage(line1);
                  player.sendMessage(line2);
                  player.sendMessage(line3);
                  player.sendMessage(footer);

                  playStatusSound(player);
              }

              private void sendStatusConsole(com.velocitypowered.api.command.CommandSource source) {
                  String blockadeText = blockade ? "ODBLOKOWANY" : "ZABLOKOWANY";

                  source.sendMessage(Component.text(
                          "LifeStealSMP | Blokada: " + blockadeText +
                                  " | Serwer: " + getStateText(),
                          getStateColor()
                  ));
              }

              private void playPortalSound(Player player) {
                  player.playSound(
                          Sound.sound(
                                  Key.key("entity.experience_orb.pickup"),
                                  Sound.Source.PLAYER,
                                  1.2f,
                                  1.25f
                          )
                  );
                  player.playSound(
                          Sound.sound(
                                  Key.key("entity.player.levelup"),
                                  Sound.Source.PLAYER,
                                  0.45f,
                                  1.8f
                          )
                  );
              }

              private void playBlockedSound(Player player) {
                  player.playSound(
                          Sound.sound(
                                  Key.key("block.note_block.pling"),
                                  Sound.Source.PLAYER,
                                  1.0f,
                                  1.0f
                          )
                  );
              }

              private void playOnSound(Player player) {
                  player.playSound(
                          Sound.sound(
                                  Key.key("entity.player.levelup"),
                                  Sound.Source.PLAYER,
                                  1.0f,
                                  1.0f
                          )
                  );
              }

              private void playOffSound(Player player) {
                  player.playSound(
                          Sound.sound(
                                  Key.key("block.note_block.pling"),
                                  Sound.Source.PLAYER,
                                  1.0f,
                                  0.9f
                          )
                  );
              }

              private void playStatusSound(Player player) {
                  player.playSound(
                          Sound.sound(
                                  Key.key("block.note_block.chime"),
                                  Sound.Source.PLAYER,
                                  0.9f,
                                  1.4f
                          )
                  );
                  player.playSound(
                          Sound.sound(
                                  Key.key("entity.experience_orb.pickup"),
                                  Sound.Source.PLAYER,
                                  0.8f,
                                  1.2f
                          )
                  );
              }

              private class BlockadeCommand implements SimpleCommand {

                  @Override
                  public void execute(Invocation invocation) {
                      String[] args = invocation.arguments();

                      if (args.length != 1) {
                          invocation.source().sendMessage(
                                  Component.text(
                                          "Użycie: /blokadaLifeStealSMP on/off"
                                  ).color(NamedTextColor.YELLOW)
                          );
                          return;
                      }

                      if (args[0].equalsIgnoreCase("on")) {
                          blockade = true;
                          saveConfig();

                          invocation.source().sendMessage(
                                  Component.text(
                                          "LifeStealSMP: ODBLOKOWANY"
                                  ).color(NamedTextColor.GREEN)
                          );

                          if (invocation.source() instanceof Player player) {
                              playOnSound(player);
                          }

                          return;
                      }

                      if (args[0].equalsIgnoreCase("off")) {
                          blockade = false;
                          saveConfig();

                          invocation.source().sendMessage(
                                  Component.text(
                                          "LifeStealSMP: ZABLOKOWANY"
                                  ).color(NamedTextColor.RED)
                          );

                          if (invocation.source() instanceof Player player) {
                              playOffSound(player);
                          }

                          return;
                      }

                      invocation.source().sendMessage(
                              Component.text(
                                      "Użycie: /blokadaLifeStealSMP on/off"
                              ).color(NamedTextColor.YELLOW)
                      );
                  }

                  @Override
                  public boolean hasPermission(Invocation invocation) {
                      return true;
                  }
              }

              private class StatusCommand implements SimpleCommand {

                  @Override
                  public void execute(Invocation invocation) {
                      if (invocation.source() instanceof Player player) {
                          sendStatus(player);
                      } else {
                          sendStatusConsole(invocation.source());
                      }
                  }

                  @Override
                  public boolean hasPermission(Invocation invocation) {
                      return true;
                  }
              }
          }
          EOF


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Paper
        working-directory: paper
        run: mvn clean package

      - name: Build Velocity
        working-directory: velocity
        run: mvn clean package

      # ============================================================
      # OUTPUT
      # ============================================================

      - name: Prepare JAR files
        run: |
          mkdir -p output
          cp paper/target/ServerTeleport-Paper-1.0.0.jar \
             output/ServerTeleport-Paper.jar
          cp velocity/target/ServerTeleport-Velocity-1.2.0.jar \
             output/ServerTeleport-Velocity.jar

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: ServerTeleport-JARs
          path: output/
