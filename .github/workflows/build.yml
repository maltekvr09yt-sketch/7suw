name: Build LifeStealSMP ServerTeleport

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply sounds
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*.java'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('entity.villager.yes', 'entity.player.levelup')
              s = s.replace('block.note_block.chime', 'block.note_block.hat')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Build
        run: mvn -B clean package

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: LifeStealSMP-ServerTeleport
          path: '**/target/*.jar'
          if-no-files-found: error
