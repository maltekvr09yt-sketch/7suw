name: Build ServerTeleport

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Utworz projekt
        shell: bash
        run: |
          set -e

          mkdir -p src/main/java/pl/reniferek/servertp
          mkdir -p src/main/resources

          cat > pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>

            <groupId>pl.reniferek</groupId>
            <artifactId>ServerTeleport</artifactId>
            <version>1.0.0</version>

            <properties>
              <maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>

            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>

            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>1.21.4-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>

            <build>
              <finalName>ServerTeleport</finalName>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>
                  <configuration>
                    <release>21</release>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

          cat > src/main/resources/plugin.yml <<'EOF'
          name: ServerTeleport
          version: 1.0.0
          main: pl.reniferek.servertp.ServerTeleport
          api-version: '1.21'
          EOF

          cat > src/main/java/pl/reniferek/servertp/ServerTeleport.java <<'EOF'
          package pl.reniferek.servertp;

          import org.bukkit.Location;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerMoveEvent;
          import org.bukkit.plugin.java.JavaPlugin;

          import java.io.ByteArrayOutputStream;
          import java.io.DataOutputStream;
          import java.io.IOException;
          import java.util.HashSet;
          import java.util.Set;
          import java.util.UUID;

          public final class ServerTeleport extends JavaPlugin implements Listener {

              private final Set<UUID> inside = new HashSet<>();

              @Override
              public void onEnable() {
                  getServer().getPluginManager().registerEvents(this, this);
                  getServer().getMessenger().registerOutgoingPluginChannel(this, "BungeeCord");
                  getLogger().info("ServerTeleport wlaczony!");
              }

              @Override
              public void onDisable() {
                  getServer().getMessenger().unregisterOutgoingPluginChannel(this, "BungeeCord");
                  inside.clear();
              }

              @EventHandler
              public void onPlayerMove(PlayerMoveEvent event) {
                  if (event.getTo() == null) return;

                  Player player = event.getPlayer();
                  Location loc = event.getTo();

                  boolean inRegion =
                          loc.getBlockX() >= -4 &&
                          loc.getBlockX() <= 4 &&
                          loc.getBlockY() >= 68 &&
                          loc.getBlockY() <= 77 &&
                          loc.getBlockZ() == 9 &&
                          loc.getBlock().getType().isAir();

                  UUID uuid = player.getUniqueId();

                  if (inRegion) {
                      if (inside.add(uuid)) {
                          sendToServer(player, "LifeStealSMPspawn");
                      }
                  } else {
                      inside.remove(uuid);
                  }
              }

              private void sendToServer(Player player, String serverName) {
                  try {
                      ByteArrayOutputStream bytes = new ByteArrayOutputStream();
                      DataOutputStream out = new DataOutputStream(bytes);

                      out.writeUTF("Connect");
                      out.writeUTF(serverName);
                      out.flush();

                      player.sendPluginMessage(this, "BungeeCord", bytes.toByteArray());
                  } catch (IOException e) {
                      getLogger().warning("Nie udalo sie wyslac gracza na " + serverName);
                  }
              }
          }
          EOF

      - name: Zbuduj plugin
        run: mvn -B clean package

      - name: Przeslij JAR
        uses: actions/upload-artifact@v4
        with:
          name: ServerTeleport-JAR
          path: target/ServerTeleport.jar
