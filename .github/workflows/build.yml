name: Build ServerTeleport

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Utworz projekt
        shell: bash
        run: |
          set -e

          mkdir -p src/main/java/pl/reniferek/servertp
          mkdir -p src/main/resources

          cat > pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>

            <groupId>pl.reniferek</groupId>
            <artifactId>ServerTeleport</artifactId>
            <version>1.0.0</version>

            <properties>
              <maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>

            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>

            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>1.21.4-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>

            <build>
              <finalName>ServerTeleport</finalName>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>
                  <configuration>
                    <release>21</release>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

          cat > src/main/resources/plugin.yml <<'EOF'
          name: ServerTeleport
          version: 1.0.0
          main: pl.reniferek.servertp.ServerTeleport
          api-version: '1.21'

          commands:
            stp:
              description: ServerTeleport
              usage: /stp reload
              permission: serverteleport.reload

          permissions:
            serverteleport.reload:
              default: op
          EOF

          cat > src/main/resources/config.yml <<'EOF'
          # Komenda wykonywana jako gracz
          command: "server LifeStealSMPspawn"

          # Wiadomosc dla gracza
          message: "&aWYKRYTO STREFE!"

          # Obszar
          min-x: -4
          max-x: 4

          min-y: 68
          max-y: 77

          z: 9

          # WERSJA TESTOWA:
          # false = nie sprawdza, czy blok jest powietrzem
          require-air: false

          # Komenda tylko raz po wejściu
          once-per-entry: true
          EOF

          cat > src/main/java/pl/reniferek/servertp/ServerTeleport.java <<'EOF'
          package pl.reniferek.servertp;

          import org.bukkit.ChatColor;
          import org.bukkit.Location;
          import org.bukkit.command.Command;
          import org.bukkit.command.CommandExecutor;
          import org.bukkit.command.CommandSender;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerMoveEvent;
          import org.bukkit.plugin.java.JavaPlugin;

          import java.util.HashSet;
          import java.util.Set;
          import java.util.UUID;

          public final class ServerTeleport extends JavaPlugin
                  implements Listener, CommandExecutor {

              private final Set<UUID> playersInside = new HashSet<>();

              @Override
              public void onEnable() {

                  saveDefaultConfig();

                  getServer().getPluginManager()
                          .registerEvents(this, this);

                  if (getCommand("stp") != null) {
                      getCommand("stp").setExecutor(this);
                  }

                  getLogger().info("==============================");
                  getLogger().info("ServerTeleport WLACZONY");
                  getLogger().info("X: -4 do 4");
                  getLogger().info("Y: 68 do 77");
                  getLogger().info("Z: 9");
                  getLogger().info("require-air: " +
                          getConfig().getBoolean("require-air"));
                  getLogger().info("==============================");
              }

              @Override
              public void onDisable() {
                  playersInside.clear();
              }

              @Override
              public boolean onCommand(
                      CommandSender sender,
                      Command command,
                      String label,
                      String[] args) {

                  if (args.length == 1 &&
                          args[0].equalsIgnoreCase("reload")) {

                      if (!sender.hasPermission(
                              "serverteleport.reload")) {

                          sender.sendMessage(
                                  ChatColor.RED +
                                  "Nie masz uprawnien!"
                          );

                          return true;
                      }

                      reloadConfig();

                      playersInside.clear();

                      sender.sendMessage(
                              ChatColor.GREEN +
                              "ServerTeleport: config.yml " +
                              "przeladowany!"
                      );

                      getLogger().info(
                              "Config.yml zostal przeladowany."
                      );

                      return true;
                  }

                  sender.sendMessage(
                          ChatColor.YELLOW +
                          "Uzycie: /stp reload"
                  );

                  return true;
              }

              @EventHandler
              public void onPlayerMove(PlayerMoveEvent event) {

                  if (event.getTo() == null) {
                      return;
                  }

                  Player player = event.getPlayer();
                  Location loc = event.getTo();

                  int x = loc.getBlockX();
                  int y = loc.getBlockY();
                  int z = loc.getBlockZ();

                  boolean inArea =
                          x >= getConfig().getInt("min-x", -4) &&
                          x <= getConfig().getInt("max-x", 4) &&
                          y >= getConfig().getInt("min-y", 68) &&
                          y <= getConfig().getInt("max-y", 77) &&
                          z == getConfig().getInt("z", 9);

                  /*
                   * TEST:
                   * require-air jest domyslnie false.
                   */
                  if (getConfig().getBoolean(
                          "require-air", false)) {

                      inArea =
                              inArea &&
                              loc.getBlock().getType().isAir();
                  }

                  UUID uuid = player.getUniqueId();

                  if (inArea) {

                      if (!getConfig().getBoolean(
                              "once-per-entry", true)
                              || playersInside.add(uuid)) {

                          getLogger().info(
                                  "================================"
                          );

                          getLogger().info(
                                  "WYKRYTO GRACZA: " +
                                  player.getName()
                          );

                          getLogger().info(
                                  "POZYCJA: " +
                                  x + " " +
                                  y + " " +
                                  z
                          );

                          getLogger().info(
                                  "WYKONUJE KOMENDE JAKO GRACZ"
                          );

                          sendMessage(player);
                          executeCommand(player);

                          getLogger().info(
                                  "================================"
                          );
                      }

                  } else {

                      playersInside.remove(uuid);
                  }
              }

              private void sendMessage(Player player) {

                  String message =
                          getConfig().getString(
                                  "message",
                                  ""
                          );

                  if (message == null ||
                          message.trim().isEmpty()) {
                      return;
                  }

                  player.sendMessage(
                          ChatColor.translateAlternateColorCodes(
                                  '&',
                                  message
                          )
                  );
              }

              private void executeCommand(Player player) {

                  String command =
                          getConfig().getString(
                                  "command",
                                  ""
                          );

                  if (command == null ||
                          command.trim().isEmpty()) {

                      getLogger().warning(
                              "command w config.yml jest pusta!"
                      );

                      return;
                  }

                  command = command.trim();

                  if (command.startsWith("/")) {
                      command = command.substring(1);
                  }

                  getLogger().info(
                          "Wykonuje: /" + command +
                          " jako " + player.getName()
                  );

                  boolean result =
                          player.performCommand(command);

                  getLogger().info(
                          "Wynik wykonania komendy: " +
                          result
                  );
              }
          }
          EOF

      - name: Zbuduj plugin
        run: mvn -B clean package

      - name: Przeslij JAR
        uses: actions/upload-artifact@v4
        with:
          name: ServerTeleport-JAR
          path: target/ServerTeleport.jar
