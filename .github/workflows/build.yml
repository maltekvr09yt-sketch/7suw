name: Build ServerTeleport

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Utworz projekt
        shell: bash
        run: |
          set -e

          mkdir -p src/main/java/pl/reniferek/servertp
          mkdir -p src/main/resources

          cat > pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">

            <modelVersion>4.0.0</modelVersion>

            <groupId>pl.reniferek</groupId>
            <artifactId>ServerTeleport</artifactId>
            <version>1.0.0</version>

            <properties>
              <maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>

            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>

            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>1.21.4-R0.1-SNAPSHOT</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>

            <build>
              <finalName>ServerTeleport</finalName>

              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.13.0</version>

                  <configuration>
                    <release>21</release>
                  </configuration>
                </plugin>
              </plugins>
            </build>

          </project>
          EOF

          cat > src/main/resources/plugin.yml <<'EOF'
          name: ServerTeleport
          version: 1.0.0
          main: pl.reniferek.servertp.ServerTeleport
          api-version: '1.21'
          EOF

          cat > src/main/java/pl/reniferek/servertp/ServerTeleport.java <<'EOF'
          package pl.reniferek.servertp;

          import org.bukkit.Location;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerMoveEvent;
          import org.bukkit.plugin.java.JavaPlugin;

          import java.io.ByteArrayOutputStream;
          import java.io.DataOutputStream;
          import java.io.IOException;
          import java.util.HashSet;
          import java.util.Set;
          import java.util.UUID;

          public final class ServerTeleport extends JavaPlugin implements Listener {

              private final Set<UUID> playersInside = new HashSet<>();

              @Override
              public void onEnable() {

                  getServer().getPluginManager()
                          .registerEvents(this, this);

                  // Kanał komunikacji z Velocity
                  getServer().getMessenger()
                          .registerOutgoingPluginChannel(this, "BungeeCord");

                  getLogger().info("====================================");
                  getLogger().info("ServerTeleport WLACZONY");
                  getLogger().info("Obszar:");
                  getLogger().info("X: -4 do 4");
                  getLogger().info("Y: 68 do 77");
                  getLogger().info("Z: 9");
                  getLogger().info("Komenda/cel: LifeStealSMPspawn");
                  getLogger().info("====================================");
              }

              @Override
              public void onDisable() {

                  getServer().getMessenger()
                          .unregisterOutgoingPluginChannel(this, "BungeeCord");

                  playersInside.clear();
              }

              @EventHandler
              public void onPlayerMove(PlayerMoveEvent event) {

                  if (event.getTo() == null) {
                      return;
                  }

                  Player player = event.getPlayer();

                  Location location = event.getTo();

                  int x = location.getBlockX();
                  int y = location.getBlockY();
                  int z = location.getBlockZ();

                  boolean inArea =
                          x >= -4 &&
                          x <= 4 &&
                          y >= 68 &&
                          y <= 77 &&
                          z == 9;

                  boolean isAir =
                          location.getBlock().getType().isAir();

                  boolean entered = inArea && isAir;

                  UUID uuid = player.getUniqueId();

                  /*
                   * Gracz właśnie wszedł w obszar.
                   */
                  if (entered) {

                      if (playersInside.add(uuid)) {

                          getLogger().info(
                                  "GRACZ " +
                                  player.getName() +
                                  " WSZEDL DO OBSZARU " +
                                  "XYZ: " +
                                  x + " " +
                                  y + " " +
                                  z
                          );

                          /*
                           * Odpowiednik wykonania:
                           *
                           * /server LifeStealSMPspawn
                           *
                           * przez gracza.
                           */
                          connectPlayer(
                                  player,
                                  "LifeStealSMPspawn"
                          );
                      }

                  } else {

                      /*
                       * Gracz wyszedł z obszaru.
                       * Przy następnym wejściu ponownie zadziała.
                       */
                      playersInside.remove(uuid);
                  }
              }

              private void connectPlayer(
                      Player player,
                      String serverName
              ) {

                  try {

                      ByteArrayOutputStream byteStream =
                              new ByteArrayOutputStream();

                      DataOutputStream out =
                              new DataOutputStream(byteStream);

                      /*
                       * Velocity/BungeeCord:
                       *
                       * Connect
                       * LifeStealSMPspawn
                       */
                      out.writeUTF("Connect");
                      out.writeUTF(serverName);
                      out.flush();

                      getLogger().info(
                              "PRZENOSZENIE GRACZA " +
                              player.getName() +
                              " -> " +
                              serverName
                      );

                      player.sendPluginMessage(
                              this,
                              "BungeeCord",
                              byteStream.toByteArray()
                      );

                  } catch (IOException exception) {

                      getLogger().severe(
                              "Nie udalo sie przeniesc gracza " +
                              player.getName() +
                              ": " +
                              exception.getMessage()
                      );
                  }
              }
          }
          EOF

      - name: Zbuduj plugin
        run: mvn -B clean package

      - name: Przeslij JAR
        uses: actions/upload-artifact@v4
        with:
          name: ServerTeleport-JAR
          path: target/ServerTeleport.jar
