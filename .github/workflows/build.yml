name: Build ServerTeleport

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Create pom.xml
        run: |
          cat > pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                   https://maven.apache.org/xsd/maven-4.0.0.xsd">

              <modelVersion>4.0.0</modelVersion>

              <groupId>pl.reniferek</groupId>
              <artifactId>ServerTeleport</artifactId>
              <version>1.0.0</version>

              <properties>
                  <maven.compiler.release>21</maven.compiler.release>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.21.4-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <release>21</release>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>

          </project>
          EOF

      - name: Create plugin.yml
        run: |
          mkdir -p src/main/resources

          cat > src/main/resources/plugin.yml <<'EOF'
          name: ServerTeleport
          version: 1.0.0
          main: pl.reniferek.servertp.ServerTeleport
          api-version: '1.21'

          commands:
            stp:
              description: ServerTeleport
              usage: /stp reload
              permission: serverteleport.reload

          permissions:
            serverteleport.reload:
              description: Allows /stp reload
              default: op
          EOF

      - name: Create config.yml
        run: |
          cat > src/main/resources/config.yml <<'EOF'
          # Nazwa serwera w Velocity
          server: "LifeStealSMPspawn"

          # Wiadomość po wykryciu strefy
          message: "&aWYKRYTO STREFE! Przenoszenie..."

          # Strefa
          min-x: -4
          max-x: 4

          min-y: 68
          max-y: 77

          # Z musi być dokładnie 9
          z: 9

          # Czy gracz musi stać w powietrzu?
          require-air: false

          # Przenosi tylko raz podczas jednego wejścia
          once-per-entry: true
          EOF

      - name: Create Java plugin
        run: |
          mkdir -p src/main/java/pl/reniferek/servertp

          cat > src/main/java/pl/reniferek/servertp/ServerTeleport.java <<'EOF'
          package pl.reniferek.servertp;

          import org.bukkit.ChatColor;
          import org.bukkit.Location;
          import org.bukkit.entity.Player;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerMoveEvent;
          import org.bukkit.event.player.PlayerQuitEvent;
          import org.bukkit.plugin.java.JavaPlugin;

          import java.io.ByteArrayOutputStream;
          import java.io.DataOutputStream;
          import java.io.IOException;
          import java.util.HashSet;
          import java.util.Set;
          import java.util.UUID;

          public class ServerTeleport extends JavaPlugin implements Listener {

              private final Set<UUID> playersInRegion = new HashSet<>();

              @Override
              public void onEnable() {

                  saveDefaultConfig();

                  // Rejestracja kanału Plugin Messaging
                  getServer().getMessenger().registerOutgoingPluginChannel(
                          this,
                          "BungeeCord"
                  );

                  getServer().getPluginManager().registerEvents(
                          this,
                          this
                  );

                  getLogger().info(
                          "================================="
                  );

                  getLogger().info(
                          "ServerTeleport zostal wlaczony!"
                  );

                  getLogger().info(
                          "Plugin Messaging: WLACZONE"
                  );

                  getLogger().info(
                          "Serwer docelowy: "
                                  + getConfig().getString("server")
                  );

                  getLogger().info(
                          "Strefa: X "
                                  + getConfig().getInt("min-x")
                                  + " do "
                                  + getConfig().getInt("max-x")
                                  + ", Y "
                                  + getConfig().getInt("min-y")
                                  + " do "
                                  + getConfig().getInt("max-y")
                                  + ", Z="
                                  + getConfig().getInt("z")
                  );

                  getLogger().info(
                          "================================="
                  );
              }

              @Override
              public void onDisable() {

                  getServer().getMessenger().unregisterOutgoingPluginChannel(
                          this,
                          "BungeeCord"
                  );

                  playersInRegion.clear();
              }

              @EventHandler
              public void onMove(PlayerMoveEvent event) {

                  if (event.getTo() == null) {
                      return;
                  }

                  Player player = event.getPlayer();

                  Location location = event.getTo();

                  boolean inside = isInsideRegion(
                          player,
                          location
                  );

                  UUID uuid = player.getUniqueId();

                  if (inside) {

                      boolean alreadyInside =
                              playersInRegion.contains(uuid);

                      if (getConfig().getBoolean(
                              "once-per-entry",
                              true
                      ) && alreadyInside) {

                          return;
                      }

                      playersInRegion.add(uuid);

                      teleportPlayer(player);

                  } else {

                      playersInRegion.remove(uuid);
                  }
              }

              private boolean isInsideRegion(
                      Player player,
                      Location location
              ) {

                  int x = location.getBlockX();
                  int y = location.getBlockY();
                  int z = location.getBlockZ();

                  int minX = getConfig().getInt("min-x");
                  int maxX = getConfig().getInt("max-x");

                  int minY = getConfig().getInt("min-y");
                  int maxY = getConfig().getInt("max-y");

                  int requiredZ = getConfig().getInt("z");

                  // Sprawdzanie X
                  if (x < minX || x > maxX) {
                      return false;
                  }

                  // Sprawdzanie Y
                  if (y < minY || y > maxY) {
                      return false;
                  }

                  // Sprawdzanie Z
                  if (z != requiredZ) {
                      return false;
                  }

                  // Opcjonalne sprawdzanie powietrza
                  if (getConfig().getBoolean(
                          "require-air",
                          false
                  )) {

                      if (!location.getBlock().isEmpty()) {
                          return false;
                      }
                  }

                  return true;
              }

              private void teleportPlayer(Player player) {

                  String server = getConfig().getString(
                          "server",
                          "LifeStealSMPspawn"
                  );

                  String message = getConfig().getString(
                          "message",
                          "&aWYKRYTO STREFE! Przenoszenie..."
                  );

                  player.sendMessage(
                          ChatColor.translateAlternateColorCodes(
                                  '&',
                                  message
                          )
                  );

                  getLogger().info(
                          "WYKRYTO STREFE: "
                                  + player.getName()
                                  + " -> "
                                  + server
                  );

                  sendToVelocity(
                          player,
                          server
                  );
              }

              private void sendToVelocity(
                      Player player,
                      String server
              ) {

                  try {

                      ByteArrayOutputStream byteArray =
                              new ByteArrayOutputStream();

                      DataOutputStream out =
                              new DataOutputStream(byteArray);

                      /*
                       * BungeeCord / Velocity Plugin Messaging
                       *
                       * Connect = zmiana serwera
                       * server = nazwa serwera w velocity.toml
                       */

                      out.writeUTF("Connect");
                      out.writeUTF(server);

                      player.sendPluginMessage(
                              this,
                              "BungeeCord",
                              byteArray.toByteArray()
                      );

                      out.close();
                      byteArray.close();

                      getLogger().info(
                              "Plugin Message wyslany dla "
                                      + player.getName()
                                      + " -> "
                                      + server
                      );

                  } catch (IOException e) {

                      getLogger().severe(
                              "BLAD Plugin Messaging: "
                                      + e.getMessage()
                      );
                  }
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent event) {

                  playersInRegion.remove(
                          event.getPlayer().getUniqueId()
                  );
              }

              @Override
              public boolean onCommand(
                      org.bukkit.command.CommandSender sender,
                      org.bukkit.command.Command command,
                      String label,
                      String[] args
              ) {

                  if (!command.getName().equalsIgnoreCase("stp")) {
                      return false;
                  }

                  if (args.length == 1
                          && args[0].equalsIgnoreCase("reload")) {

                      if (!sender.hasPermission(
                              "serverteleport.reload"
                      )) {

                          sender.sendMessage(
                                  ChatColor.RED
                                          + "Nie masz uprawnien."
                          );

                          return true;
                      }

                      reloadConfig();

                      playersInRegion.clear();

                      sender.sendMessage(
                              ChatColor.GREEN
                                      + "ServerTeleport: "
                                      + "config.yml przeladowany."
                      );

                      getLogger().info(
                              "Konfiguracja zostala przeladowana."
                      );

                      return true;
                  }

                  sender.sendMessage(
                          ChatColor.YELLOW
                                  + "Uzycie: /stp reload"
                  );

                  return true;
              }
          }
          EOF

      - name: Build
        run: mvn clean package

      - name: Rename JAR
        run: |
          mkdir -p output
          cp target/ServerTeleport-1.0.0.jar output/ServerTeleport.jar

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ServerTeleport
          path: output/ServerTeleport.jar
